[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "closy-forge"
version = "0.1.0"
description = "Deterministic Closy garment foundry foundation and T-shirt vertical slice."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Closy" }]
dependencies = ["Pillow==11.1.0"]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.6",
  "mypy==1.14.1"
]

[project.scripts]
closy-forge = "closy_forge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["closy_forge"]
