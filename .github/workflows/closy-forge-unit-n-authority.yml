name: Forge Unit N sealed confirmation

on:
  pull_request:
    branches:
      - codex/closy-forge-d0-disjoint-tshirt-confirmation-v2
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  sealed-confirmation:
    name: Unit N sealed evidence verification
    if: github.head_ref == 'codex/closy-forge-d0-strict-c3-confirmation-v5'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact Unit N head
        shell: bash
        run: |
          test "${GITHUB_HEAD_REF}" = "codex/closy-forge-d0-strict-c3-confirmation-v5"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: closy-forge/requirements-dev.lock
      - name: Install frozen Forge environment
        working-directory: closy-forge
        run: python -m pip install -e ".[dev]" -c requirements-dev.lock
      - name: Verify frozen lock and sealed evidence
        working-directory: closy-forge
        run: |
          python scripts/build_d0_strict_c3_confirmation_v5_lock.py --check
          python -m pytest tests/unit/test_d0_strict_c3_confirmation_v5.py
