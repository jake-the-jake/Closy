name: Forge Unit M untouched cohort authority

on:
  pull_request:
    paths:
      - "closy-forge/src/closy_forge/disjoint_confirmation_v2/**"
      - "closy-forge/scripts/*d0_disjoint_confirmation_v2*.py"
      - "closy-forge/fixtures/d0_disjoint_tshirt_confirmation_v2/protocol_lock.json"
      - "closy-forge/fixtures/d0_disjoint_tshirt_confirmation_v2/development_proof.json"
      - "closy-forge/fixtures/d0_disjoint_tshirt_confirmation_v2/prior_inventory.json"
      - "closy-forge/tests/unit/test_d0_disjoint_confirmation_v2.py"
      - ".github/workflows/closy-forge-unit-m-authority.yml"

permissions:
  actions: read
  contents: read

jobs:
  untouched-authority:
    name: Unit M untouched cohort authority
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      LOCK_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Reject reruns and later authority runs
        shell: bash
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          prior_runs="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/closy-forge-unit-m-authority.yml/runs?branch=${GITHUB_HEAD_REF}&event=pull_request&per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | [.id, .conclusion] | @tsv")"
          prior_count=0
          while IFS=$'\t' read -r prior_id prior_conclusion; do
            test -n "$prior_id" || continue
            prior_count=$((prior_count + 1))
            test "$prior_conclusion" = "failure"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${prior_id}/artifacts" --jq '.total_count')" = "0"
          done <<< "$prior_runs"
          test "$prior_count" -le "1"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: closy-forge/requirements-dev.lock
      - name: Install frozen Forge environment
        working-directory: closy-forge
        run: python -m pip install -e ".[dev]" -c requirements-dev.lock
      - name: Verify exact lock and execute one untouched authority attempt
        working-directory: closy-forge
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$LOCK_SHA"
          python - <<'PY'
          from pathlib import Path

          from closy_forge.disjoint_confirmation_v2.protocol import (
              load_protocol,
              validate_implementation,
          )
          from closy_forge.package_io.hashing import sha256_file

          root = Path.cwd()
          protocol = load_protocol(root)
          issues = validate_implementation(root, protocol)
          if issues:
              raise SystemExit(";".join(issues))
          expected = protocol["seedAuthorityLifecycle"]["initialWorkflowSha256"]
          actual = sha256_file(root.parent / ".github/workflows/closy-forge-unit-m-authority.yml")
          if actual != expected:
              raise SystemExit("confirmation_v2_initial_authority_workflow_hash_mismatch")
          PY
          job_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '.jobs[] | select(.name == "Unit M untouched cohort authority") | .id')"
          test -n "$job_id"
          python scripts/run_d0_disjoint_confirmation_v2_authority.py \
            --output "$RUNNER_TEMP/unit-m-official-attempt" \
            --lock-sha "$LOCK_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-job-id "$job_id"
      - name: Validate completed attempt before publication
        working-directory: closy-forge
        run: |
          python scripts/import_d0_disjoint_confirmation_v2_attempt.py \
            --source "$RUNNER_TEMP/unit-m-official-attempt" --check
      - name: Upload already-revealed completed attempt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unit-m-official-attempt-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/unit-m-official-attempt
          if-no-files-found: error
          retention-days: 30
      - name: Record sanitized authority summary
        shell: bash
        run: |
          echo "lock_sha=${LOCK_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "authority_run_id=${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "seed_bits=256" >> "$GITHUB_STEP_SUMMARY"
          echo "prediction_denominator=64" >> "$GITHUB_STEP_SUMMARY"
          echo "raw_seed_logged=false" >> "$GITHUB_STEP_SUMMARY"
          echo "targets_uploaded_only_after_prediction_freeze=true" >> "$GITHUB_STEP_SUMMARY"
