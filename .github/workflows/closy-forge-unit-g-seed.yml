name: Forge Unit G seed authority

on:
  pull_request:
    paths:
      - "closy-forge/fixtures/d0_disjoint_tshirt_benchmark_v1/protocol_lock.json"
      - "closy-forge/fixtures/d0_disjoint_tshirt_benchmark_v1/development_lock.json"
      - "closy-forge/fixtures/d0_disjoint_tshirt_benchmark_v1/development_summary.json"
      - "closy-forge/src/closy_forge/disjoint_benchmark_v1/**"
      - "closy-forge/scripts/*d0_disjoint_benchmark_v1*.py"
      - ".github/workflows/closy-forge-unit-g-seed.yml"

permissions:
  contents: read

jobs:
  seed-authority:
    name: Unit G first non-rerun seed authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Verify pre-evaluator lock
        working-directory: closy-forge
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("fixtures/d0_disjoint_tshirt_benchmark_v1")
          protocol = json.loads((root / "protocol_lock.json").read_text())
          lock = json.loads((root / "development_lock.json").read_text())
          assert protocol["evaluatorIdentitiesRealized"] is False
          assert protocol["targetContentsMounted"] is False
          assert lock["evaluatorIdentitiesRealized"] is False
          assert lock["targetContentsMounted"] is False
          assert not (root / "evaluator").exists()
          print("unit_g_seed_authority_lock_valid")
          PY
      - name: Record seed authority inputs
        run: |
          echo "lock_sha=${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "run_id=${GITHUB_RUN_ID}" >> "${GITHUB_STEP_SUMMARY}"
          echo "run_attempt=${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_STEP_SUMMARY}"
