name: Closy Forge

on:
  pull_request:
    paths:
      - "closy-forge/**"
      - "docs/closy-garment-package-v1.md"
      - ".github/workflows/closy-forge.yml"
  push:
    branches: ["main"]
    paths:
      - "closy-forge/**"
      - "docs/closy-garment-package-v1.md"
      - ".github/workflows/closy-forge.yml"

jobs:
  forge:
    name: Python 3.11 Forge checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: closy-forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Forge dev environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c requirements-dev.lock
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Test
        run: python -m pytest
      - name: Check schemas
        run: python -m closy_forge schemas check --schema-dir schemas/v1
      - name: Build deterministic demo twice
        run: |
          python -m closy_forge demo build-tshirt --output ../generated/ci/demo_a.closygarment --force
          python -m closy_forge demo build-tshirt --output ../generated/ci/demo_b.closygarment --force
      - name: Compare deterministic outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          from closy_forge.package_io.hashing import sha256_file

          def hashes(root: Path) -> dict[str, str]:
              return {
                  p.relative_to(root).as_posix(): sha256_file(p)
                  for p in sorted(root.rglob("*"))
                  if p.is_file()
              }

          a = Path("../generated/ci/demo_a.closygarment")
          b = Path("../generated/ci/demo_b.closygarment")
          assert hashes(a) == hashes(b)
          PY
      - name: Validate and report
        run: |
          python -m closy_forge validate ../generated/ci/demo_a.closygarment
          python -m closy_forge report ../generated/ci/demo_a.closygarment
