name: Closy Forge

on:
  pull_request:
    paths:
      - "closy-forge/**"
      - "docs/closy-garment-package-v1.md"
      - ".github/workflows/closy-forge.yml"
  push:
    branches: ["main"]
    paths:
      - "closy-forge/**"
      - "docs/closy-garment-package-v1.md"
      - ".github/workflows/closy-forge.yml"

permissions:
  contents: read

jobs:
  forge:
    name: Forge ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    defaults:
      run:
        shell: bash
        working-directory: closy-forge
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Forge dev environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c requirements-dev.lock
      - name: Format check
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Test
        run: python -m pytest
      - name: Check schemas
        run: python -m closy_forge schemas check --schema-dir schemas/v1
      - name: Build deterministic demo twice
        run: |
          mkdir -p "$RUNNER_TEMP/closy-forge"
          python -m closy_forge demo build-tshirt --output "$RUNNER_TEMP/closy-forge/demo_a.closygarment" --force
          python -m closy_forge demo build-tshirt --output "$RUNNER_TEMP/closy-forge/demo_b.closygarment" --force
      - name: Compare deterministic outputs
        run: python -m closy_forge packages diff "$RUNNER_TEMP/closy-forge/demo_a.closygarment" "$RUNNER_TEMP/closy-forge/demo_b.closygarment" --json
      - name: Validate and report
        run: |
          python -m closy_forge validate "$RUNNER_TEMP/closy-forge/demo_a.closygarment"
          python -m closy_forge report "$RUNNER_TEMP/closy-forge/demo_a.closygarment"
      - name: Build sleeveless-top deterministic fixture twice
        run: |
          python -m closy_forge demo build-sleeveless --output "$RUNNER_TEMP/closy-forge/sleeveless_a.closygarment" --force
          python -m closy_forge demo build-sleeveless --output "$RUNNER_TEMP/closy-forge/sleeveless_b.closygarment" --force
      - name: Compare, validate and report sleeveless-top fixture
        run: |
          python -m closy_forge packages diff "$RUNNER_TEMP/closy-forge/sleeveless_a.closygarment" "$RUNNER_TEMP/closy-forge/sleeveless_b.closygarment" --json
          python -m closy_forge validate "$RUNNER_TEMP/closy-forge/sleeveless_a.closygarment"
          python -m closy_forge report "$RUNNER_TEMP/closy-forge/sleeveless_a.closygarment"
      - name: Build long-sleeved-top deterministic fixture twice
        run: |
          python -m closy_forge demo build-long-sleeved --output "$RUNNER_TEMP/closy-forge/long_sleeved_a.closygarment" --force
          python -m closy_forge demo build-long-sleeved --output "$RUNNER_TEMP/closy-forge/long_sleeved_b.closygarment" --force
      - name: Compare, validate and report long-sleeved-top fixture
        run: |
          python -m closy_forge packages diff "$RUNNER_TEMP/closy-forge/long_sleeved_a.closygarment" "$RUNNER_TEMP/closy-forge/long_sleeved_b.closygarment" --json
          python -m closy_forge validate "$RUNNER_TEMP/closy-forge/long_sleeved_a.closygarment"
          python -m closy_forge report "$RUNNER_TEMP/closy-forge/long_sleeved_a.closygarment"
      - name: Build simple-skirt deterministic fixture twice
        run: |
          python -m closy_forge demo build-simple-skirt --output "$RUNNER_TEMP/closy-forge/simple_skirt_a.closygarment" --force
          python -m closy_forge demo build-simple-skirt --output "$RUNNER_TEMP/closy-forge/simple_skirt_b.closygarment" --force
      - name: Compare, validate and report simple-skirt fixture
        run: |
          python -m closy_forge packages diff "$RUNNER_TEMP/closy-forge/simple_skirt_a.closygarment" "$RUNNER_TEMP/closy-forge/simple_skirt_b.closygarment" --json
          python -m closy_forge validate "$RUNNER_TEMP/closy-forge/simple_skirt_a.closygarment"
          python -m closy_forge report "$RUNNER_TEMP/closy-forge/simple_skirt_a.closygarment"
      - name: Build simple-trousers deterministic fixture twice
        run: |
          python -m closy_forge demo build-simple-trousers --output "$RUNNER_TEMP/closy-forge/simple_trousers_a.closygarment" --force
          python -m closy_forge demo build-simple-trousers --output "$RUNNER_TEMP/closy-forge/simple_trousers_b.closygarment" --force
      - name: Compare, validate and report simple-trousers fixture
        run: |
          python -m closy_forge packages diff "$RUNNER_TEMP/closy-forge/simple_trousers_a.closygarment" "$RUNNER_TEMP/closy-forge/simple_trousers_b.closygarment" --json
          python -m closy_forge validate "$RUNNER_TEMP/closy-forge/simple_trousers_a.closygarment"
          python -m closy_forge report "$RUNNER_TEMP/closy-forge/simple_trousers_a.closygarment"
      - name: Build simple-dress deterministic fixture twice
        run: |
          python -m closy_forge demo build-simple-dress --output "$RUNNER_TEMP/closy-forge/simple_dress_a.closygarment" --force
          python -m closy_forge demo build-simple-dress --output "$RUNNER_TEMP/closy-forge/simple_dress_b.closygarment" --force
      - name: Compare, validate and report simple-dress fixture
        run: |
          python -m closy_forge packages diff "$RUNNER_TEMP/closy-forge/simple_dress_a.closygarment" "$RUNNER_TEMP/closy-forge/simple_dress_b.closygarment" --json
          python -m closy_forge validate "$RUNNER_TEMP/closy-forge/simple_dress_a.closygarment"
          python -m closy_forge report "$RUNNER_TEMP/closy-forge/simple_dress_a.closygarment"
      - name: Build button-shirt deterministic fixture twice
        run: |
          python -m closy_forge demo build-button-shirt --output "$RUNNER_TEMP/closy-forge/button_shirt_a.closygarment" --force
          python -m closy_forge demo build-button-shirt --output "$RUNNER_TEMP/closy-forge/button_shirt_b.closygarment" --force
      - name: Compare, validate and report button-shirt fixture
        run: |
          python -m closy_forge packages diff "$RUNNER_TEMP/closy-forge/button_shirt_a.closygarment" "$RUNNER_TEMP/closy-forge/button_shirt_b.closygarment" --json
          python -m closy_forge validate "$RUNNER_TEMP/closy-forge/button_shirt_a.closygarment"
          python -m closy_forge report "$RUNNER_TEMP/closy-forge/button_shirt_a.closygarment"
      - name: Build jacket-outerwear deterministic fixture twice
        run: |
          python -m closy_forge demo build-jacket-outerwear --output "$RUNNER_TEMP/closy-forge/jacket_outerwear_a.closygarment" --force
          python -m closy_forge demo build-jacket-outerwear --output "$RUNNER_TEMP/closy-forge/jacket_outerwear_b.closygarment" --force
      - name: Compare, validate and report jacket-outerwear fixture
        run: |
          python -m closy_forge packages diff "$RUNNER_TEMP/closy-forge/jacket_outerwear_a.closygarment" "$RUNNER_TEMP/closy-forge/jacket_outerwear_b.closygarment" --json
          python -m closy_forge validate "$RUNNER_TEMP/closy-forge/jacket_outerwear_a.closygarment"
          python -m closy_forge report "$RUNNER_TEMP/closy-forge/jacket_outerwear_a.closygarment"
      - name: Build layered-asymmetric deterministic fixture twice
        run: |
          python -m closy_forge demo build-layered-asymmetric --output "$RUNNER_TEMP/closy-forge/layered_asymmetric_a.closygarment" --force
          python -m closy_forge demo build-layered-asymmetric --output "$RUNNER_TEMP/closy-forge/layered_asymmetric_b.closygarment" --force
      - name: Compare, validate and report layered-asymmetric fixture
        run: |
          python -m closy_forge packages diff "$RUNNER_TEMP/closy-forge/layered_asymmetric_a.closygarment" "$RUNNER_TEMP/closy-forge/layered_asymmetric_b.closygarment" --json
          python -m closy_forge validate "$RUNNER_TEMP/closy-forge/layered_asymmetric_a.closygarment"
          python -m closy_forge report "$RUNNER_TEMP/closy-forge/layered_asymmetric_a.closygarment"
      - name: Measure non-canonical binding workloads
        run: |
          python -m closy_forge benchmark binding-c3 \
            "$RUNNER_TEMP/closy-forge/demo_a.closygarment" \
            --output "$RUNNER_TEMP/closy-forge/binding-benchmark.json" \
            --warmups 3 \
            --repeats 20 \
            --commit-sha "$GITHUB_SHA" \
            --json
      - name: Prepare sanitized determinism diagnostics
        if: failure()
        run: |
          python -m closy_forge ci diagnostics \
            --source-dir "$RUNNER_TEMP/closy-forge" \
            --output "$RUNNER_TEMP/closy-forge-safe-diagnostics" \
            --label "${{ matrix.os }}-py${{ matrix.python-version }}" \
            --force
      - name: Upload determinism diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: forge-diagnostics-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/closy-forge-safe-diagnostics
          if-no-files-found: ignore
