name: Closy Forge

on:
  pull_request:
    paths:
      - "closy-forge/**"
      - "docs/closy-garment-package-v1.md"
      - ".github/workflows/closy-forge.yml"
  push:
    branches: ["main"]
    paths:
      - "closy-forge/**"
      - "docs/closy-garment-package-v1.md"
      - ".github/workflows/closy-forge.yml"

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
    defaults:
      run:
        shell: bash
        working-directory: closy-forge
    steps:
      - uses: actions/checkout@v7
        with:
          # Evidence tests resolve historical commit references from the ledger.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: closy-forge/requirements-dev.lock
      - name: Install hash-pinned Forge dev environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c requirements-dev.lock
      - name: Format check
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Contract, unit, schema, and corruption tests
        run: python -m pytest tests/unit tests/corruption
      - name: Check schemas
        run: python -m closy_forge schemas check --schema-dir schemas/v1

  family-rebuilds:
    name: Families ${{ matrix.group }} ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: upper, os: ubuntu-latest, python-version: "3.11"}
          - {group: lower, os: ubuntu-latest, python-version: "3.11"}
          - {group: structured, os: ubuntu-latest, python-version: "3.11"}
          - {group: upper, os: windows-latest, python-version: "3.11"}
          - {group: lower, os: windows-latest, python-version: "3.11"}
          - {group: structured, os: windows-latest, python-version: "3.11"}
          - {group: upper, os: ubuntu-latest, python-version: "3.12"}
          - {group: lower, os: ubuntu-latest, python-version: "3.12"}
          - {group: structured, os: ubuntu-latest, python-version: "3.12"}
    defaults:
      run:
        shell: bash
        working-directory: closy-forge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: closy-forge/requirements-dev.lock
      - name: Install hash-pinned Forge dev environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c requirements-dev.lock
      - name: Build, compare, validate, and report family shard
        run: |
          mkdir -p "$RUNNER_TEMP/closy-forge"
          python scripts/ci_family_shard.py \
            --group "${{ matrix.group }}" \
            --output-root "$RUNNER_TEMP/closy-forge"
      - name: Upload cross-minor digest summary
        uses: actions/upload-artifact@v7
        with:
          name: family-digests-${{ matrix.group }}-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/closy-forge/family-shard-${{ matrix.group }}.json
      - name: Prepare bounded sanitized diagnostics
        if: failure()
        run: |
          python -m closy_forge ci diagnostics \
            --source-dir "$RUNNER_TEMP/closy-forge" \
            --output "$RUNNER_TEMP/closy-forge-safe-diagnostics" \
            --output-root "$RUNNER_TEMP" \
            --force
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: forge-diagnostics-${{ matrix.group }}-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/closy-forge-safe-diagnostics
          if-no-files-found: ignore

  cumulative-integration:
    name: Cumulative integration Ubuntu Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: closy-forge
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: closy-forge/requirements-dev.lock
      - name: Install hash-pinned Forge dev environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c requirements-dev.lock
      - name: Full cumulative suite
        run: python -m pytest
      - name: Measure non-canonical binding workloads
        run: |
          mkdir -p "$RUNNER_TEMP/closy-forge"
          python -m closy_forge demo build-tshirt \
            --output "$RUNNER_TEMP/closy-forge/demo.closygarment" --force
          python -m closy_forge benchmark binding-c3 \
            "$RUNNER_TEMP/closy-forge/demo.closygarment" \
            --output "$RUNNER_TEMP/closy-forge/binding-benchmark.json" \
            --warmups 3 --repeats 20 --commit-sha "$GITHUB_SHA" --json

  digest-consistency:
    name: Cross-platform and cross-minor digest consistency
    needs: [family-rebuilds]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: family-digests-*
          path: ${{ runner.temp }}/family-digests
      - name: Compare every family digest
        run: |
          python closy-forge/scripts/verify_ci_family_digests.py \
            --input-root "$RUNNER_TEMP/family-digests" \
            --family-index-output "$RUNNER_TEMP/validated-family-index.json"
      - name: Upload validated family readiness index
        uses: actions/upload-artifact@v7
        with:
          name: validated-family-readiness-index
          path: ${{ runner.temp }}/validated-family-index.json

  forge-required:
    name: Forge required
    if: always()
    needs: [contracts, family-rebuilds, cumulative-integration, digest-consistency]
    runs-on: ubuntu-latest
    steps:
      - name: Require every lane
        env:
          CONTRACTS: ${{ needs.contracts.result }}
          FAMILIES: ${{ needs.family-rebuilds.result }}
          INTEGRATION: ${{ needs.cumulative-integration.result }}
          DIGESTS: ${{ needs.digest-consistency.result }}
        run: |
          test "$CONTRACTS" = success
          test "$FAMILIES" = success
          test "$INTEGRATION" = success
          test "$DIGESTS" = success
